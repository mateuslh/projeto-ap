site_name: Apartamento M&I
site_description: Solicitações de alteração ao projeto de interiores, por revisão e por ambiente.
site_url: https://mateuslh.github.io/projeto-ap/
site_author: Mateus Leal Hemkemeier

repo_url: https://github.com/mateuslh/projeto-ap
repo_name: mateuslh/projeto-ap
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.action.edit
    - content.tooltips
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para o modo claro

nav:
  - Início: index.md
  - Como ler: convencoes.md
  - Revisões:
      - R1 — Escritório, suíte e banhos: r1.md
      - R2 — Sala, cozinha e serviço:
          - r2/index.md
          - 1. Sala: r2/sala.md
          - 2. Cozinha: r2/cozinha.md
          - 3. Lavanderia: r2/lavanderia.md
          - 4. Quarto de hóspede: r2/hospede.md
          - 5. Todos os cômodos: r2/geral.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # Preserva acentuação nas âncoras, mantendo compatibilidade com os links do GitHub
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        # Diagramas de dependência renderizados pelo Mermaid embarcado no tema
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Abreviações de uso comum, anexadas automaticamente a todas as páginas
  - pymdownx.snippets:
      base_path: [includes]
      auto_append: [abreviacoes.md]
      check_paths: true

plugins:
  - search:
      lang: pt
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      draggable: true

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mateuslh/projeto-ap
      name: Repositório no GitHub

copyright: Documento de trabalho — uso restrito ao acompanhamento do projeto.
