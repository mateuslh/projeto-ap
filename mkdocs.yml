site_name: Apartamento M&I
site_description: Solicitações de alteração ao projeto de interiores, organizadas por bloco de ambientes e por revisão.
site_url: https://mateuslh.github.io/projeto-ap/
site_author: Mateus Leal Hemkemeier

repo_url: https://github.com/mateuslh/projeto-ap
repo_name: mateuslh/projeto-ap
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: pt-BR
  custom_dir: overrides
  favicon: assets/favicon.svg
  icon:
    logo: material/home-variant-outline
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    # Sem isto os blocos ficam colapsados por padrão e o menu parece vazio
    # nas páginas fora deles (Início, Como ler).
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.tooltips
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Alternar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Alternar para o modo claro

nav:
  - Início: index.md
  - Como ler: convencoes.md
  # Um bloco de ambientes por seção; dentro dele, uma pasta por revisão.
  # Uma revisão nova entra como privativos/r2/ ou sociais/r2/, sem renomear nada.
  - Privativos:
      - privativos/index.md
      - Revisão 1:
          - privativos/r1/index.md
          - 1. Escritório: privativos/r1/escritorio.md
          - 2. Suíte: privativos/r1/suite.md
          - 3. Banho suíte: privativos/r1/banho-suite.md
          - 4. Banho social: privativos/r1/banho-social.md
  - Sociais e de serviço:
      - sociais/index.md
      - Revisão 1:
          - sociais/r1/index.md
          - 1. Sala: sociais/r1/sala.md
          - 2. Cozinha: sociais/r1/cozinha.md
          - 3. Lavanderia: sociais/r1/lavanderia.md
          - 4. Quarto de hóspede/filho: sociais/r1/hospede.md
          - 5. Todos os cômodos: sociais/r1/geral.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # Preserva acentuação nas âncoras, mantendo compatibilidade com os links do GitHub
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        # Diagramas de dependência renderizados pelo Mermaid embarcado no tema
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Abreviações de uso comum, anexadas automaticamente a todas as páginas
  - pymdownx.snippets:
      base_path: [includes]
      auto_append: [abreviacoes.md]
      check_paths: true

plugins:
  - search:
      lang: pt
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      draggable: true

# Acrescenta um hash aos assets próprios para evitar versões antigas no navegador.
hooks:
  - hooks/cache_bust.py
  - hooks/project_data.py

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/tracker.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mateuslh/projeto-ap
      name: Repositório no GitHub

copyright: Documento de trabalho — uso restrito ao acompanhamento do projeto.
